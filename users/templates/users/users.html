<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Users</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #101214;
            --muted: #6a7078;
            --surface: #eceff2;
            --white: #fff;
            --line: #dde1e6;
            --red: #f0372c;
            --red-dark: #c92a20;
        }

        body {
            min-height: 100vh;
            padding: 32px 20px 56px;
            font-family: "Manrope", "Segoe UI", Arial, sans-serif;
            color: var(--ink);
            background: var(--surface);
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        .logo {
            margin-bottom: 40px;
            font-family: "Bricolage Grotesque", sans-serif;
            font-weight: 800;
            font-size: 24px;
            letter-spacing: -0.5px;
        }
        .logo b { color: var(--red); }

        .header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 26px;
        }

        .header h1 {
            font-family: "Bricolage Grotesque", sans-serif;
            font-size: 44px;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1;
        }

        .count {
            margin-top: 10px;
            font-size: 15px;
            color: var(--muted);
        }

        .logout-btn {
            padding: 11px 22px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
            background: var(--white);
            border: 2px solid var(--ink);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .logout-btn:hover {
            background: var(--ink);
            color: var(--white);
        }
        .logout-btn:focus-visible,
        .user-item:focus-visible {
            outline: 3px solid var(--red);
            outline-offset: 3px;
        }

        .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }
        .quick-links a {
            padding: 9px 13px;
            color: var(--ink);
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .quick-links a:hover { border-color: var(--ink); background: var(--surface); }
        .quick-links a:focus-visible {
            outline: 3px solid var(--red);
            outline-offset: 2px;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 18px;
            background: var(--white);
            border: 2px solid transparent;
            border-radius: 16px;
            color: var(--ink);
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(16, 18, 20, 0.06);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .user-item:hover {
            border-color: var(--ink);
            box-shadow: 0 10px 28px rgba(16, 18, 20, 0.12);
        }

        .avatar {
            flex-shrink: 0;
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            font-family: "Bricolage Grotesque", sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: var(--white);
            background: var(--ink);
            border-radius: 50%;
        }

        .username {
            flex: 1;
            font-size: 17px;
            font-weight: 700;
            word-break: break-word;
        }

        .arrow {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            color: var(--muted);
            background: var(--surface);
            border-radius: 50%;
            transition: background 0.2s, color 0.2s;
        }
        .arrow svg { width: 16px; height: 16px; }
        .user-item:hover .arrow {
            background: var(--red);
            color: var(--white);
        }

        .empty {
            text-align: center;
            padding: 48px 20px;
            font-size: 16px;
            color: var(--muted);
            background: var(--white);
            border: 2px dashed var(--line);
            border-radius: 16px;
        }

        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header h1 { font-size: 38px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Auto<b>Market</b></div>

    <div class="header">
        <div>
            <h1>All Users</h1>
            <p class="count">{{ users|length }} registered</p>
        </div>

        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>

    <nav class="quick-links" aria-label="Useful links">
        <a href="{% url 'cars' %}">Cars</a>
        <a href="{% url 'brands' %}">Brands</a>
        <a href="{% url 'models' %}">Models</a>
        <a href="{% url 'my_orders' %}">Orders</a>
        <a href="{% url 'my_chats' %}">Chats</a>
        <a href="{% url 'notifications' %}">Notifications</a>
    </nav>

    <div class="user-list">
        {% for user in users %}
            <a class="user-item" href="{% url 'user_detail' user.pk %}">
                <span class="avatar">{{ user.username|slice:":1"|upper }}</span>
                <span class="username">{{ user.username }}</span>
                <span class="arrow" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                </span>
            </a>
        {% empty %}
            <p class="empty">No users found.</p>
        {% endfor %}
    </div>
</div>

</body>
</html>
