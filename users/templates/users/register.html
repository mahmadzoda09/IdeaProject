<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f4ede4;
            --card: #fffaf3;
            --ink: #2d2a26;
            --muted: #7a7166;
            --accent: #c2410c;
            --accent-hover: #9a3412;
            --border: #e2d6c6;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--ink);
            background: var(--bg);
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 44px 34px 36px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(80, 55, 25, 0.10);
        }

        .card h1 {
            font-family: "Playfair Display", Georgia, serif;
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 28px;
        }

        form p {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="tel"],
        input[type="date"] {
            padding: 12px 14px;
            font-family: inherit;
            font-size: 15px;
            color: var(--ink);
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.15);
        }

        .helptext {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
            line-height: 1.5;
        }
        .helptext ul { margin: 4px 0 0 18px; }

        .errorlist {
            list-style: none;
            font-size: 13px;
            color: #b91c1c;
            background: #fdecea;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: var(--accent-hover); }
        button:active { transform: scale(0.98); }

        .footer-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: var(--accent);
            text-decoration: none;
        }
        .footer-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h1>Register</h1>
    <p class="subtitle">Create your account</p>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>

    <a class="footer-link" href="{% url 'login' %}">Already have an account?</a>
</div>

</body>
</html>
