<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brands</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #101214;
            --muted: #6a7078;
            --surface: #eceff2;
            --white: #fff;
            --line: #dde1e6;
            --red: #f0372c;
            --red-dark: #c92a20;
        }

        body {
            min-height: 100vh;
            padding: 32px 20px 56px;
            font-family: "Manrope", "Segoe UI", Arial, sans-serif;
            color: var(--ink);
            background: var(--surface);
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        .logo {
            margin-bottom: 40px;
            font-family: "Bricolage Grotesque", sans-serif;
            font-weight: 800;
            font-size: 24px;
            letter-spacing: -0.5px;
        }
        .logo b { color: var(--red); }

        .header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
        }

        h1 {
            font-family: "Bricolage Grotesque", sans-serif;
            font-size: 44px;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1;
        }

        .add-btn {
            padding: 12px 22px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            color: var(--white);
            background: var(--red);
            border-radius: 10px;
            transition: background 0.2s, transform 0.1s;
        }
        .add-btn:hover { background: var(--red-dark); }
        .add-btn:active { transform: scale(0.98); }
        .add-btn:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px;
        }

        .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: -12px 0 24px;
        }
        .quick-links a {
            padding: 9px 13px;
            text-align: center;
            text-decoration: none;
            color: var(--ink);
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            transition: border-color 0.2s, background 0.2s;
        }
        .quick-links a:hover { border-color: var(--ink); background: var(--surface); }
        .quick-links a:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 2px;
        }

        .brand-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 14px;
        }

        .brand-grid p:not(.empty) {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            font-size: 17px;
            font-weight: 700;
            word-break: break-word;
            background: var(--white);
            border: 2px solid transparent;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(16, 18, 20, 0.06);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .brand-grid p:not(.empty):hover {
            border-color: var(--ink);
            box-shadow: 0 10px 28px rgba(16, 18, 20, 0.12);
        }
        .brand-grid p:not(.empty)::before {
            content: "";
            flex-shrink: 0;
            width: 10px;
            height: 38px;
            border-radius: 6px;
            background: var(--red);
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 48px 20px;
            font-size: 16px;
            color: var(--muted);
            background: var(--white);
            border: 2px dashed var(--line);
            border-radius: 16px;
        }

        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; }
            h1 { font-size: 38px; }
            .brand-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .brand-grid p:not(.empty) { padding: 14px; font-size: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Auto<b>Market</b></div>

    <div class="header">
        <h1>Brands</h1>
        <a class="add-btn" href="{% url 'add_brand' %}">Add brand</a>
    </div>

    <nav class="quick-links" aria-label="Useful links">
        <a href="{% url 'add_model' %}">Add model</a>
        <a href="{% url 'models' %}">Models</a>
        <a href="{% url 'cars' %}">Cars</a>
    </nav>

    <div class="brand-grid">
        {% for brand in brands %}
                <p>{{ brand.name }}</p>
        {% empty %}
            <p class="empty">No brands found.</p>
        {% endfor %}
    </div>
</div>

</body>
</html>
