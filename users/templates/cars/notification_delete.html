<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Notification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #101214;
            --muted: #6a7078;
            --surface: #eceff2;
            --white: #fff;
            --line: #dde1e6;
            --red: #f0372c;
            --red-dark: #c92a20;
        }

        body {
            min-height: 100vh;
            padding: 32px 20px 64px;
            font-family: "Manrope", "Segoe UI", Arial, sans-serif;
            color: var(--ink);
            background: var(--surface);
        }

        .container { max-width: 560px; margin: 0 auto; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 32px;
        }
        .logo {
            font-family: "Bricolage Grotesque", sans-serif;
            font-weight: 800;
            font-size: 24px;
        }
        .logo b { color: var(--red); }

        .back {
            padding: 10px 16px;
            color: var(--ink);
            background: var(--white);
            border: 2px solid var(--line);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }
        .back:hover { border-color: var(--ink); }

        .card {
            padding: 36px 32px;
            text-align: center;
            background: var(--white);
            border-top: 6px solid var(--red);
            border-radius: 20px;
            box-shadow: 0 18px 50px rgba(16, 18, 20, 0.10);
        }
        .warn {
            width: 76px;
            height: 76px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            color: var(--red);
            background: #fff1f0;
            border-radius: 50%;
        }
        .warn svg { width: 36px; height: 36px; }

        h1 {
            font-family: "Bricolage Grotesque", sans-serif;
            font-size: clamp(28px, 5vw, 38px);
            font-weight: 800;
            line-height: 1.1;
        }
        .text {
            margin: 14px 0 26px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
        }

        .actions { display: flex; flex-direction: column; gap: 10px; }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 18px;
            font: inherit;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-red {
            color: var(--white);
            background: var(--red);
            border-color: var(--red);
            box-shadow: 0 10px 24px rgba(240, 55, 44, 0.28);
        }
        .btn-red:hover { background: var(--red-dark); border-color: var(--red-dark); }
        .btn-light { color: var(--ink); background: var(--white); border-color: var(--line); }
        .btn-light:hover { border-color: var(--ink); }

        .quick-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 18px;
        }
        .quick-links a {
            padding: 9px 13px;
            text-align: center;
            text-decoration: none;
            color: var(--ink);
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            transition: border-color 0.2s, background 0.2s;
        }
        .quick-links a:hover { border-color: var(--ink); background: var(--surface); }

        a:focus-visible, button:focus-visible {
            outline: 3px solid var(--red);
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            body { padding: 20px 12px 40px; }
            .card { padding: 28px 20px; }
        }
    </style>
</head>
<body>
<main class="container">
    <div class="topbar">
        <div class="logo">Auto<b>Market</b></div>
        <a class="back" href="{% url 'notifications' %}">Back to notifications</a>
    </div>

    <section class="card" aria-labelledby="delete-title">
        <div class="warn" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>
        </div>
        <h1 id="delete-title">Delete notification?</h1>
        <p class="text">This notification will be permanently removed. This action cannot be undone.</p>

        <form class="actions" action="{% url 'notification_delete' notification.id %}" method="post">
            {% csrf_token %}
            <button class="btn btn-red" type="submit">Yes, delete</button>
            <a class="btn btn-light" href="{% url 'notifications' %}">Cancel</a>
        </form>
    </section>

    <nav class="quick-links" aria-label="Useful links">
        <a href="{% url 'cars' %}">Cars</a>
        <a href="{% url 'favorites' %}">Favorites</a>
        <a href="{% url 'my_orders' %}">Orders</a>
    </nav>
</main>
</body>
</html>
